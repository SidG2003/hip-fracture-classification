[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "hip-fracture-classification"
version = "0.1.0"
description = "Research image classification with a frozen SKELEX encoder."
requires-python = ">=3.11"
dependencies = [
    "numpy==2.4.6",
    "Pillow==12.3.0",
    "scikit-learn==1.9.1",
    "torch==2.14.0",
    "torchvision==0.29.0",
    "transformers==5.17.0",
]

[project.scripts]
hip-fracture = "hip_fracture.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
