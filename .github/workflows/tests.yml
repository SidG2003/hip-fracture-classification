name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU dependencies and package
        run: |
          python -m pip install torch==2.14.0 torchvision==0.29.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
          python -m pip check
      - name: Run tests without access to Hugging Face
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_VERBOSITY: error
        run: python -m unittest discover -s tests -v
      - name: Check CLI
        run: hip-fracture --help
